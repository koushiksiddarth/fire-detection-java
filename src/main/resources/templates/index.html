<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fire Detection System</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>

<header>
    <h2>🔥 Fire Detection System</h2>
    <a href="/">Home</a>
</header>

<main>

    <section class="hero">
        <h1>Fire Detection Using Java</h1>
        <p>Upload an image to detect possible fire.</p>
        <span>● System Ready</span>
    </section>

    <section class="container">

        <div class="card">
            <h2>📤 Upload Image</h2>

            <input
                type="file"
                id="image"
                accept="image/*"
            >

            <img
                id="preview"
                class="preview"
                alt="Image preview"
            >

            <button id="detect" disabled>
                🔥 Detect Fire
            </button>
        </div>

        <div class="card">
            <h2>🧠 Detection Result</h2>

            <div id="result" class="result">
                Upload an image to begin detection.
            </div>
        </div>

    </section>

</main>

<script>

const imageInput = document.getElementById("image");
const preview = document.getElementById("preview");
const detectButton = document.getElementById("detect");
const result = document.getElementById("result");

imageInput.addEventListener("change", function () {

    const file = this.files[0];

    if (!file) {
        return;
    }

    preview.src = URL.createObjectURL(file);
    preview.style.display = "block";

    detectButton.disabled = false;

    result.innerHTML = "Image selected. Click Detect Fire.";

});

detectButton.addEventListener("click", async function () {

    const file = imageInput.files[0];

    if (!file) {
        return;
    }

    result.innerHTML = "⏳ Analyzing image...";

    const formData = new FormData();

    formData.append("image", file);

    try {

        const response = await fetch("/api/detect", {
            method: "POST",
            body: formData
        });

        const data = await response.json();

        result.innerHTML =
            "<h3>" + data.result + "</h3>" +
            "<p>Confidence: " + data.confidence + "%</p>" +
            "<p>Status: " + data.status + "</p>";

    } catch (error) {

        result.innerHTML =
            "❌ Detection failed. Please check the server.";

    }

});

</script>

</body>
</html>
